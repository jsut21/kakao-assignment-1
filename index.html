<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="todo-app" aria-labelledby="appTitle">
      <section class="todo-panel">
        <header class="app-header">
          <p class="app-label">Productivity</p>
          <h1 id="appTitle">Todo App</h1>
        </header>

        <form id="todoForm" class="todo-form" novalidate>
          <label class="sr-only" for="todoInput">할 일 입력</label>
          <input
            id="todoInput"
            class="todo-input"
            type="text"
            placeholder="오늘 할 일을 입력하세요"
            autocomplete="off"
          />
          <button class="add-button" type="submit">추가</button>
        </form>

        <p id="messageText" class="message-text" role="status" aria-live="polite"></p>

        <ul id="todoList" class="todo-list" aria-label="Todo 목록"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
